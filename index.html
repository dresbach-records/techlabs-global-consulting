    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #EDEDED;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(25, 195, 125, 0.1);
        border-top-color: #19C37D;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-loader">
      <div class="spinner"></div>
      <div style="margin-top: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3em; color: #19C37D;">
        DRESBACH HOSTING System Initialize
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>

    <script>
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Hide loader only when React app is fully loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }, 1000);
      });

      // Your suggested fallback script
      setTimeout(() => {
        const root = document.getElementById('root');
        const loader = document.getElementById('initial-loader');

        if (root && !root.hasChildNodes() && loader) {
          loader.innerHTML = '<p style="color:#ff5555;font-size:12px;font-family:monospace;text-align:center;">Error: Application failed to load.<br>Please contact support.</p>';
          loader.style.opacity = '1';
        }
      }, 5000); // Check after 5 seconds
    </script>
  </body>
