
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DRESBACH HOSTING | Global Technical Consulting</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DRESBACH HOSTING" />
    <link rel="apple-touch-icon" href="/ICONE-DMG.ico" />
    <link rel="manifest" href="./manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #EDEDED;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      /* Pre-loader para evitar tela branca enquanto o React carrega */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(25, 195, 125, 0.1);
        border-top-color: #19C37D;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .grid-pattern {
        background-image: radial-gradient(#2F2F2F 1px, transparent 1px);
        background-size: 40px 40px;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #000000; }
      ::-webkit-scrollbar-thumb { background: #2F2F2F; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #19C37D; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.2.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Elemento que garante que o usuário não veja uma tela branca vazia -->
    <div id="initial-loader">
      <div class="spinner"></div>
      <div style="margin-top: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3em; color: #19C37D;">
        DRESBACH HOSTING System Initialize
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="./index.tsx"></script>

    <script>
      // Desabilitar clique com o botão direito
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Registro do Service Worker com caminho relativo './'
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => console.log('SW Registered successfully for scope:', reg.scope))
            .catch(err => {
              console.warn('SW Registration Failed (Expected in some sandboxes):', err.message);
            });
        });
      }

      // Remover loader quando o app estiver pronto
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.style.opacity = '0';
          setTimeout(() => loader?.remove(), 500);
        }, 1000);
      });
    </script>
  </body>
</html>
